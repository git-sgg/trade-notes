version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: trade-notes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: trade123
      MYSQL_DATABASE: trade_notes
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./seed_stores.sql:/docker-entrypoint-initdb.d/2-seed.sql
    ports:
      - "3307:3306"
      # 注意：宿主机端口 3307 映射到容器内 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: trade-notes-backend
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: trade123
      # Alpha Vantage Key（可选，仅用作腾讯接口失败时的兜底）
      # STOCK_API_KEY: YOUR_KEY_HERE

  frontend:
    build: ./frontend
    container_name: trade-notes-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
